name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting
        run: npx prettier --check .

      - name: Lint Code
        run: npm run lint

  typecheck-and-test:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:run

  build-and-security:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Check Version Match
        run: |
          MANIFEST_VERSION=$(node -p "require('./src/manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: manifest=$MANIFEST_VERSION, package=$PACKAGE_VERSION"
            exit 1
          fi
          echo "Versions match: $MANIFEST_VERSION"

      - name: Check Icon Sizes
        run: |
          REQUIRED_SIZES="16 32 48 128"
          for size in $REQUIRED_SIZES; do
            if [ ! -f "dist/icons/icon-$size.png" ]; then
              echo "Missing icon: dist/icons/icon-$size.png"
              exit 1
            fi
          done
          echo "All required icons present."

      - name: Validate Built Extension
        run: npx chrome-webstore-validator dist/

      - name: Verify Manifest Permissions (Security Gate)
        run: node scripts/check-permissions.js

      - name: Check Dist Size
        run: |
          echo "Dist directory size:"
          du -sh dist
          echo "Number of files in dist:"
          find dist -type f | wc -l

      - name: Remove Source Maps (if any)
        run: |
          if [ -n "$(find dist -name '*.map' -print -quit 2>/dev/null)" ]; then
            echo "Removing source maps from dist..."
            find dist -name '*.map' -delete
            echo "Source maps removed."
          else
            echo "No source maps found in dist."
          fi

  dependency-audit:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --production